name: Build & Release Flutter APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart
        run: flutter --version

      - name: Ensure gradlew is executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SmartSpend.apk
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            cp build/app/outputs/flutter-apk/app-release.apk "dist/SmartSpend-${TAG_NAME}.apk"
          fi
          ls -lh dist

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartSpend-Release-APK
          path: dist/*
          retention-days: 30

      - name: Publish to GitHub Releases (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SmartSpend.apk
            dist/*.apk
          name: SmartSpend ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
